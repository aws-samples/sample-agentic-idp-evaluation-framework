<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Kept in sync with PRODUCT_NAME / PRODUCT_TAGLINE_SHORT in
      packages/shared/src/constants/branding.ts. This file is the static shell, so it
      cannot import them — a test asserts the two agree, because the tab title said
      "IDP Evaluation Framework" while the header said "ONE IDP Framework" and the
      splash said "ONE IDP", so one product looked like three.
    -->
    <title>ONE IDP Evaluation Framework</title>
    <meta name="description" content="Compare AWS document processing methods side by side on your own documents." />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #fafbfc; color: #16191f; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      #app-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 9999; background: #fafbfc; transition: opacity 200ms ease; }
      #app-splash.hidden { opacity: 0; pointer-events: none; }
      #app-splash .logo { width: 48px; height: 48px; border-radius: 10px; background: linear-gradient(135deg, #0972d3 0%, #1a66ad 100%); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 18px; letter-spacing: 0.5px; box-shadow: 0 4px 12px rgba(9, 114, 211, 0.25); }
      #app-splash .spinner { width: 28px; height: 28px; border: 2.5px solid rgba(9, 114, 211, 0.15); border-top-color: #0972d3; border-radius: 50%; animation: app-splash-spin 720ms linear infinite; }
      #app-splash .label { font-size: 13px; color: #5f6b7a; letter-spacing: 0.15px; font-weight: 500; }
      #app-splash .sublabel { font-size: 12px; color: #95a5ba; margin-top: -10px; }
      @keyframes app-splash-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      /*
        Pre-React splash colors only. Once the app mounts, Cloudscape controls
        theming by toggling `awsui-dark-mode` on <body>, so the page background
        must follow THAT class — not just the OS preference. Keying dark styles
        solely off `prefers-color-scheme` meant the in-app Dark Mode toggle
        recolored every component but left the page background and gutters
        light, so dark content sat inside a white frame.
      */
      @media (prefers-color-scheme: dark) {
        html, body, #app-splash { background: #0f1419; color: #e9ebed; }
        #app-splash .label { color: #a2a9b0; }
        #app-splash .sublabel { color: #5f6b7a; }
      }
      /* In-app toggle: wins over the OS preference in both directions. */
      body.awsui-dark-mode { background: #0f1419; color: #e9ebed; }
      html:has(body.awsui-dark-mode) { background: #0f1419; }
      body:not(.awsui-dark-mode) { background: #fafbfc; color: #16191f; }
      html:has(body:not(.awsui-dark-mode)) { background: #fafbfc; }
    </style>
  </head>
  <body>
    <div id="app-splash" role="status" aria-live="polite" aria-label="Loading ONE IDP Evaluation Framework">
      <div class="logo">IDP</div>
      <div class="spinner"></div>
      <div class="label">Loading…</div>
      <div class="sublabel">One moment.</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
